<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barbilla Rainforest Tour · Fundación Work with Nature</title>
  <meta name="description" content="Visit National Park Barbilla, sector Matina, Costa Rica. A guided day in the Caribbean lowland rainforest by Fundación Work with Nature.">
  <meta name="theme-color" content="#0B110D">
  <link rel="icon" href="assets/logos/adopt-rainforest.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&family=Roboto+Slab:wght@500;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#tour" data-t="nav.tour"></a>

  <!-- ============ HEADER ============ -->
  <header class="site-header" id="top">
    <a class="brand" href="#top" aria-label="Fundación Work with Nature">
      <img src="assets/logos/adopt-rainforest.png" alt="" width="40" height="35">
      <span class="brand-text">Work with Nature</span>
    </a>
    <nav class="main-nav" id="mainNav" aria-label="Main">
      <a href="#tour" data-t="nav.tour"></a>
      <a href="#partners" data-t="nav.partners"></a>
      <a href="#logistics" data-t="nav.logistics"></a>
    </nav>
    <div class="header-actions">
      <button class="lang-toggle" type="button" id="langToggle"><span aria-hidden="true">EN</span><span class="lang-sep" aria-hidden="true">/</span><span aria-hidden="true">ES</span></button>
      <a class="btn btn-primary btn-sm header-cta" href="#book" data-t="nav.book"></a>
      <button class="menu-btn" type="button" id="menuBtn" aria-expanded="false" aria-controls="mainNav"><span class="sr" data-t="nav.menu"></span><i></i><i></i></button>
    </div>
  </header>

  <main>
    <!-- ============ HERO ============ -->
    <section class="hero" id="hero" aria-labelledby="heroTitle">
      <div class="hero-media">
        <img class="hero-poster" id="heroPoster" alt="">
        <video class="hero-video" id="heroVideo" muted playsinline preload="metadata" aria-hidden="true"></video>
        <canvas class="fireflies" id="fireflies" aria-hidden="true"></canvas>
        <div class="hero-shade"></div>
      </div>
      <div class="hero-content wrap">
        <p class="eyebrow" data-t="hero.eyebrow"></p>
        <h1 id="heroTitle" class="display">
          <span class="line"><span data-t="hero.titleLine1"></span></span>
          <span class="line accent"><span data-t="hero.titleLine2"></span></span>
        </h1>
        <p class="hero-place" data-tour="place"></p>
        <p class="hero-sub lead" data-t="hero.subtitle"></p>
        <div class="hero-ctas">
          <a class="btn btn-primary" href="#book"><span data-t="hero.cta"></span><svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg></a>
          <a class="btn btn-ghost" href="#tour" data-t="hero.secondary"></a>
        </div>
      </div>
      <div class="hero-bottom wrap">
        <dl class="facts" id="heroFacts"></dl>
        <button class="video-toggle" type="button" id="videoToggle" hidden>
          <svg class="ic" aria-hidden="true"><use href="#i-pause"/></svg><span class="sr"></span>
        </button>
      </div>
    </section>

    <!-- ============ MOVING PHOTO RIBBON ============ -->
    <section class="ribbon" aria-hidden="true">
      <div class="ribbon-track" id="ribbonA"></div>
      <div class="ribbon-track reverse" id="ribbonB"></div>
    </section>

    <!-- ============ 1. THE TOUR ============ -->
    <section class="tour" id="tour" aria-labelledby="tourTitle">
      <div class="wrap section-head">
        <p class="eyebrow" data-t="tour.eyebrow"></p>
        <h2 id="tourTitle" data-t="tour.title"></h2>
        <p class="lead" data-t="tour.intro"></p>
      </div>
      <div class="wrap trail">
        <div class="trail-line" aria-hidden="true"><div class="trail-fill" id="trailFill"></div></div>
        <ol class="stops" id="stops"></ol>
      </div>
    </section>

    <!-- ============ 2. PARTNERS ============ -->
    <section class="partners" id="partners" aria-labelledby="partnersTitle">
      <div class="wrap partners-grid">
        <div class="partners-head">
          <p class="eyebrow" data-t="partners.eyebrow"></p>
          <h2 id="partnersTitle" data-t="partners.title"></h2>
          <p class="lead" data-t="partners.intro"></p>
        </div>
        <ul class="partner-list" id="partnerList"></ul>
      </div>
    </section>

    <!-- ============ 3. LOGISTICS ============ -->
    <section class="logistics" id="logistics" aria-labelledby="logTitle">
      <div class="wrap section-head">
        <p class="eyebrow" data-t="logistics.eyebrow"></p>
        <h2 id="logTitle" data-t="logistics.title"></h2>
      </div>
      <div class="wrap log-grid" id="logGrid"></div>
    </section>

    <!-- ============ 4. BOOKING ============ -->
    <section class="booking" id="book" aria-labelledby="bookTitle">
      <div class="booking-bg" aria-hidden="true"><img id="bookingBg" alt=""></div>
      <div class="wrap section-head">
        <p class="eyebrow" data-t="booking.eyebrow"></p>
        <h2 id="bookTitle" data-t="booking.title"></h2>
        <p class="lead" data-t="booking.intro"></p>
      </div>
      <form class="wrap book-form" id="bookForm" novalidate>
        <div class="book-col">
          <fieldset class="panel cal-panel">
            <legend class="label"><span data-t="booking.date"></span></legend>
            <div class="cal" id="calendar"></div>
            <p class="field-error" id="err-date" role="alert"></p>
          </fieldset>
          <fieldset class="panel">
            <legend class="label sr" data-t="facts.group"></legend>
            <div class="stepper-row">
              <div class="stepper" data-field="adults">
                <span class="stepper-label" id="lbl-adults" data-t="booking.adults"></span>
                <div class="stepper-ctl">
                  <button type="button" class="step-btn" data-step="-1"><svg class="ic" aria-hidden="true"><use href="#i-minus"/></svg><span class="sr" data-t="booking.decrease"></span></button>
                  <output aria-labelledby="lbl-adults" aria-live="polite">2</output>
                  <button type="button" class="step-btn" data-step="1"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span class="sr" data-t="booking.increase"></span></button>
                </div>
              </div>
              <div class="stepper" data-field="children">
                <span class="stepper-label" id="lbl-children" data-t="booking.children"></span>
                <div class="stepper-ctl">
                  <button type="button" class="step-btn" data-step="-1"><svg class="ic" aria-hidden="true"><use href="#i-minus"/></svg><span class="sr" data-t="booking.decrease"></span></button>
                  <output aria-labelledby="lbl-children" aria-live="polite">0</output>
                  <button type="button" class="step-btn" data-step="1"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span class="sr" data-t="booking.increase"></span></button>
                </div>
              </div>
            </div>
            <p class="field-error" id="err-group" role="alert"></p>
          </fieldset>
        </div>

        <div class="book-col">
          <div class="panel fields">
            <div class="field">
              <label for="f-name" data-t="booking.name"></label>
              <input id="f-name" name="name" type="text" autocomplete="name" required>
              <p class="field-error" id="err-name" role="alert"></p>
            </div>
            <div class="field">
              <label for="f-email" data-t="booking.email"></label>
              <input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" required>
              <p class="field-error" id="err-email" role="alert"></p>
            </div>
            <div class="field">
              <label for="f-phone"><span data-t="booking.phone"></span> <small data-t="booking.phoneHint"></small></label>
              <input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+506 …">
            </div>
            <div class="field">
              <span class="label-like" id="lbl-lang" data-t="booking.language"></span>
              <div class="seg" role="radiogroup" aria-labelledby="lbl-lang" id="guideLang"></div>
            </div>
            <div class="field">
              <label for="f-notes"><span data-t="booking.notes"></span> <small data-t="booking.notesHint"></small></label>
              <textarea id="f-notes" name="notes" rows="3"></textarea>
            </div>
          </div>

          <aside class="panel summary" aria-live="polite">
            <div class="summary-head">
              <h3 class="h4" data-t="booking.summary"></h3>
              <span class="ref"><span data-t="booking.reference"></span> <code id="bookRef">—</code></span>
            </div>
            <dl class="summary-list" id="summaryList"></dl>
            <div class="summary-total">
              <span data-t="booking.total"></span>
              <strong id="summaryTotal">—</strong>
            </div>
            <p class="caption" data-t="booking.priceNote"></p>
            <button class="btn btn-primary btn-block" type="submit"><svg class="ic" aria-hidden="true"><use href="#i-mail"/></svg><span data-t="booking.submit"></span></button>
            <button class="btn btn-ghost btn-block" type="button" id="waBtn"><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg><span data-t="booking.whatsapp"></span></button>
            <div class="sent-note" id="sentNote" hidden>
              <strong data-t="booking.sentTitle"></strong>
              <p><span data-t="booking.sentText"></span> <a data-contact="email"></a>.</p>
            </div>
          </aside>
        </div>
      </form>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-logos" id="footerLogos"></div>
      <div class="footer-grid">
        <div>
          <p class="footer-tag" data-t="footer.tagline"></p>
          <a class="adopt-link" data-contact="website" target="_blank" rel="noopener"><svg class="ic" aria-hidden="true"><use href="#i-leaf"/></svg><span data-t="footer.adopt"></span></a>
        </div>
        <address class="footer-contact">
          <h2 class="eyebrow" data-t="footer.contact"></h2>
          <p class="org" data-contact="organisation"></p>
          <a data-contact="email"><svg class="ic" aria-hidden="true"><use href="#i-mail"/></svg><span></span></a>
          <a data-contact="phone"><svg class="ic" aria-hidden="true"><use href="#i-phone"/></svg><span></span></a>
          <a data-contact="whatsapp" target="_blank" rel="noopener"><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg><span>WhatsApp</span></a>
        </address>
        <div class="footer-nav">
          <a href="#tour" data-t="nav.tour"></a>
          <a href="#partners" data-t="nav.partners"></a>
          <a href="#logistics" data-t="nav.logistics"></a>
          <a href="#book" data-t="nav.book"></a>
          <button class="lang-toggle lang-toggle-text" type="button" data-lang-toggle data-t="langToggle"></button>
        </div>
      </div>
      <p class="copyright">© <span id="year"></span> <span data-contact="organisation"></span>. <span data-t="footer.rights"></span></p>
    </div>
  </footer>

  <!-- ============ ICONS ============ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2 .8 3.5 2.8 3.5 5.7"/></g></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></g></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></g></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></g></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path d="M5 3.5h3.5l2 5-2.5 1.5a11 11 0 0 0 6 6l1.5-2.5 5 2V19a2 2 0 0 1-2 2A16.5 16.5 0 0 1 3 5.5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 20l1.3-3.9A8.5 8.5 0 1 1 8 19z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-leaf" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15z"/><path d="M5 19l8-8"/></g></symbol>
      <symbol id="i-guide" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="3"/><path d="M7 21l2-8h6l2 8M9 13l-3-2M15 13l3-3"/><path d="M4 9h5"/></g></symbol>
      <symbol id="i-town" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 21h18M5 21V10l7-5 7 5v11"/><path d="M10 21v-5h4v5M9 11h6"/></g></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></g></symbol>
      <symbol id="i-hex" viewBox="0 0 24 24"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"/></symbol>
    </defs>
  </svg>

  <script src="content/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
